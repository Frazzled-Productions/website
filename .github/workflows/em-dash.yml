# No em dashes in added lines (house style). Reusable check: Frazzled-Productions/.github
# em-dash-check.yml (ops D1). Diff-only, so existing text never blocks a PR.
name: Em-dash check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: em-dash-${{ github.ref }}
  cancel-in-progress: true

jobs:
  em-dash:
    uses: Frazzled-Productions/.github/.github/workflows/em-dash-check.yml@main
