# Deploys the site to Cloudflare Workers with OpenNext and wrangler (OpenSpec change
# run-site-on-cloudflare-workers, design D5).
#
# - Push to main: test, build, apply D1 migrations to production and to the preview database,
#   deploy the Worker `website`.
# - Pull request: test and the same build without the analytics token, with no Cloudflare token and
#   no GitHub environment. The built .open-next/ is kept for a day as the artefact preview-bundle;
#   preview-upload.yml, which runs from main, uploads it as a preview version of the separate Worker
#   `website-preview` aliased pr-<number> and comments its URL (koinori #2925 F3, 20 November 2026).
#   A migration added by the PR reaches the preview database only once it merges.
# - Deploy guard (ops #610, 19 November 2026): the production job reads CLOUDFLARE_API_TOKEN from the
#   `production` environment, which admits only `main` and holds the account token (D1, R2 and
#   Workers write). No pull request job reads any Cloudflare secret, so a pull request can never
#   write a live database or deploy the live Worker, even by editing this file.
# - With no token in the production environment, or while wrangler.jsonc still holds placeholder
#   database ids, the production job skips the Cloudflare steps with a notice and passes.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  # Never cancel a production deploy half way; a newer push to a PR replaces its preview.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The Cloudflare token is passed only to the steps that call Cloudflare (and the readiness
# check), never to npm ci, npm test or the build, so dependency scripts never see it.

jobs:
  production:
    if: github.event_name == 'push'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Check Cloudflare is set up
        id: ready
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN secret, so nothing is deployed to Cloudflare. Vercel keeps serving the site until the DNS cutover."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif grep -q 'REPLACE_WITH_' wrangler.jsonc; then
            echo "::notice::wrangler.jsonc still holds placeholder D1 database ids, so nothing is deployed to Cloudflare."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - if: steps.ready.outputs.ok == 'true'
        run: npm ci
      - if: steps.ready.outputs.ok == 'true'
        run: npm test
      - if: steps.ready.outputs.ok == 'true'
        name: Build the Worker
        run: npm run cf:build
        env:
          KOFI_URL: ${{ vars.KOFI_URL }}
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.NEXT_PUBLIC_CF_BEACON_TOKEN }}
      - if: steps.ready.outputs.ok == 'true'
        name: Apply D1 migrations (website-events)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply EVENTS_DB --remote
      - if: steps.ready.outputs.ok == 'true'
        name: Apply D1 migrations (website-events-preview)
        # Pull requests cannot write D1, so the preview database follows main from here.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply EVENTS_DB --remote --env preview
      - if: steps.ready.outputs.ok == 'true'
        name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy

  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - name: Build the Worker (no analytics token)
        run: npm run cf:build
        env:
          KOFI_URL: ${{ vars.KOFI_URL }}
      - name: Keep the build for preview-upload.yml
        uses: actions/upload-artifact@v7
        with:
          name: preview-bundle
          path: .open-next/
          # .open-next/.build holds the Durable Object code the Worker bundle imports.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
